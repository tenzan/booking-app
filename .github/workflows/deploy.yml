name: Deploy
# Deploys main to Cloudflare after the same checks CI runs.
# Configuration and secrets come from a secret manager at run time; this repository holds none.
# The reference setup uses Doppler: set a read-only service token for the production config as the
# `DOPPLER_TOKEN` Actions secret. Without that secret the job is skipped (forks stay green).
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
    steps:
      - name: Skip when no deployment credentials are configured
        if: env.DOPPLER_TOKEN == ''
        run: echo "DOPPLER_TOKEN is not set; skipping deploy." && exit 0
      - uses: actions/checkout@v4
        if: env.DOPPLER_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.DOPPLER_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.DOPPLER_TOKEN != ''
        run: npm ci
      - if: env.DOPPLER_TOKEN != ''
        run: npm run typecheck
      - if: env.DOPPLER_TOKEN != ''
        run: npm run test:scripts
      - if: env.DOPPLER_TOKEN != ''
        run: npm test
      - name: Install Doppler CLI
        if: env.DOPPLER_TOKEN != ''
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3 (pinned)
      - name: Deploy
        if: env.DOPPLER_TOKEN != ''
        run: doppler run -- npm run deploy
      - name: Smoke test
        if: env.DOPPLER_TOKEN != ''
        # Single quotes: the inner shell, which has the Doppler variables, expands $APP_DOMAIN.
        run: doppler run -- sh -c 'node scripts/smoke.mjs "https://$APP_DOMAIN"'
